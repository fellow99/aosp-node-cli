# ── 公共元数据（可提交）──────────────────────────────────────────────────────
GROUP=io.github.fellow99
VERSION_NAME=0.1.0
# CLI 制品版本 = 配对 Node 版本 = Maven 坐标 version（恒等，见 docs/000-工程规划.md）。
# 注意：不能用 NODE_* 前缀——Gradle 9.4 把所有 NODE_ 前缀属性保留给内置 Node 工具链，
# -P 覆盖会被忽略；故用 CLI_VERSION（与 node-pty 的 PTY_VERSION 同纪律）。
# 多版本发布：-PCLI_VERSION=<node 版本>（见 node-cli.lock.json 的 releases）。
# 当前值为 draft 计划版本；首个真实 CI 构建后按 lock 回写事实。
CLI_VERSION=26.13.0
POM_NAME=node-cli
POM_DESCRIPTION=node command-line executable (libnode_cli.so) for Android arm64-v8a, exec-form companion paired version-for-version with aosp-node-runtime - cross-compiled from the official Node.js source tree
POM_URL=https://github.com/fellow99/aosp-node-cli
POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://opensource.org/licenses/MIT
POM_SCM_CONNECTION=scm:git:git://github.com/fellow99/aosp-node-cli.git
POM_SCM_DEVELOPMENT_CONNECTION=scm:git:git://github.com/fellow99/aosp-node-cli.git
POM_DEVELOPER_ID=fellow99
POM_DEVELOPER_NAME=fellow99

# 发布门禁（默认关；真实发布时 RELEASE=true + 用户级 gradle.properties 提供 Token/GPG）
RELEASE=false
